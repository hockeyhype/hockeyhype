# Loggar kvällens matcher (verktyg/matchlogg.py) för att se hur swehockeys matchsidor fylls på
# under en match. Startas för hand: Actions -> Matchlogg -> Run workflow. Kör till 21:45 svensk tid
# och laddar upp loggen som artefakt (sparas i 3 dagar). Publicerar ingenting.
name: Matchlogg

on:
  workflow_dispatch:

concurrency:
  group: matchlogg
  cancel-in-progress: true

jobs:
  logga:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
    env:
      TZ: Europe/Stockholm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Logga matcherna
        run: python -u verktyg/matchlogg.py
      - name: Ladda upp loggen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchlogg
          path: matchlogg/
          retention-days: 3

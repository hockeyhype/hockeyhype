# Hämtar färsk data från stats.swehockey.se varje morgon och kväll, sparar index.html och publicerar sidan.
# Dessutom matchbevakning var 10:e minut dagtid: serier med en nyss avslutad match läses om direkt.
# Körs även vid push till main (publicerar bara) och kan startas för hand under Actions -> Run workflow.
name: Daglig uppdatering

on:
  schedule:
    - cron: "0 5 * * *"     # morgon: 05:00 UTC = 06:00 vintertid / 07:00 sommartid
    # Kväll: kl 22 svensk tid på vardagar och kl 20 på helger. GitHub räknar i UTC utan sommartid,
    # så båda UTC-timmarna schemaläggs och steget "Kontrollera tiden" släpper bara igenom den rätta.
    - cron: "0 20 * * 1-5"  # 22:00 sommartid
    - cron: "0 21 * * 1-5"  # 22:00 vintertid
    - cron: "0 18 * * 0,6"  # 20:00 sommartid
    - cron: "0 19 * * 0,6"  # 20:00 vintertid
    # Matchbevakning var 10:e minut, kl 07-23 vintertid / 08-24 sommartid. Läser bara serier där en
    # match nyss borde ha tagit slut och publicerar bara om något ändrats. Minuterna 5, 15, 25 ...
    # så att den inte krockar med morgon- och kvällskörningarna (som startar på hel timme).
    - cron: "5-55/10 6-22 * * *"
  workflow_dispatch:
  # Väckning från Cloudflare-workern (worker/) när en bevakad match är slut: läs om just de serierna
  repository_dispatch:
    types: [matchklar]
  push:
    branches: [main]

concurrency:
  group: hockeyhype
  cancel-in-progress: false

jobs:
  uppdatera:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Europe/Stockholm
    outputs:
      kor: ${{ steps.tid.outputs.kor }}
      bevaka: ${{ steps.tid.outputs.bevaka }}
      andrat: ${{ steps.spara.outputs.andrat }}
    steps:
      - name: Kontrollera tiden
        id: tid
        env:
          SCHEMA: ${{ github.event.schedule }}
        run: |
          kor=true
          bevaka=false
          if [ "$SCHEMA" = "5-55/10 6-22 * * *" ] || [ "${{ github.event_name }}" = repository_dispatch ]; then
            bevaka=true
            echo "Matchbevakning (${{ github.event_name }})"
          elif [ "${{ github.event_name }}" = schedule ] && [ "$SCHEMA" != "0 5 * * *" ]; then
            utc=$(echo "$SCHEMA" | awk '{print $2}')
            forskjutning=$((10#$(date +%z | cut -c2-3)))   # 1 vintertid, 2 sommartid
            lokal=$((utc + forskjutning))
            if [ "$(date +%u)" -le 5 ]; then onskad=22; else onskad=20; fi
            [ "$lokal" -eq "$onskad" ] || kor=false
            echo "Schema $SCHEMA = kl $lokal svensk tid, kvällskörningen ska vara kl $onskad: kör=$kor"
          fi
          echo "kor=$kor" >> "$GITHUB_OUTPUT"
          echo "bevaka=$bevaka" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.tid.outputs.kor == 'true'
        with:
          # Senaste main, inte läget när körningen startades: en väckning från workern kan ha väntat på
          # en annan körning (concurrency) och annars bygga på gammal data (krockade 2026-11-22 20:44)
          ref: main
      - uses: actions/setup-python@v5
        if: steps.tid.outputs.kor == 'true'
        with:
          python-version: "3.12"
      - name: Leta efter nya serier (måndagsmorgon och körningar för hand)
        if: steps.tid.outputs.kor == 'true'
        env:
          SCHEMA: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || { [ "$SCHEMA" = "0 5 * * *" ] && [ "$(date +%u)" = 1 ]; }; then
            # Lägger bara till nya serier. Misslyckas skanningen körs uppdateringen ändå, med den gamla listan.
            python hitta_serier.py --lagg-till || echo "::warning::Skanningen efter nya serier misslyckades - befintlig serielista används"
          else
            echo "Bara måndagsmorgon och körningar för hand."
          fi
      - name: Hämta data från swehockey
        if: steps.tid.outputs.kor == 'true'
        env:
          SCHEMA: ${{ github.event.schedule }}
          SERIER: ${{ github.event.client_payload.serier }}
        run: |
          # Bara siffror och kommatecken släpps igenom från workerns väckning
          SERIER=$(echo "$SERIER" | tr -cd '0-9,')
          # Måndagsmorgonen och körningar startade för hand hämtar allt; övriga bara det som kan ha ändrats
          if [ "${{ steps.tid.outputs.bevaka }}" = true ]; then
            python dagligen.py --bevaka --las-om "$SERIER"
          elif [ "${{ github.event_name }}" = workflow_dispatch ] || { [ "$SCHEMA" = "0 5 * * *" ] && [ "$(date +%u)" = 1 ]; }; then
            python dagligen.py --full
          else
            python dagligen.py
          fi
      - name: Spara ändringar
        id: spara
        if: steps.tid.outputs.kor == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data serier.json
          if git diff --staged --quiet; then
            echo "Inga ändringar."
            echo "andrat=false" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ steps.tid.outputs.bevaka }}" = true ]; then rubrik="Matchbevakning"; else rubrik="Daglig uppdatering"; fi
            git commit -m "$rubrik $(date '+%F %H:%M')"
            # Om något annat hunnit pushas under körningen: lägg ändringarna ovanpå. Krockar i samma fil
            # löses till den här körningens data (den är nyast). Tre försök - GitHub svarar ibland inte
            # (2026-11-22 06:49).
            for forsok in 1 2 3; do
              if git pull --rebase -X theirs && git push; then break; fi
              git rebase --abort 2>/dev/null || true
              [ "$forsok" = 3 ] && exit 1
              echo "Försök $forsok misslyckades, väntar och försöker igen"; sleep 20
            done
            echo "andrat=true" >> "$GITHUB_OUTPUT"
          fi

  # Bygget och publiceringen ar separata jobb (som i GitHubs egen mall): da hinner det uppladdade
  # paketet registreras innan publiceringen letar efter det. I samma jobb hande det 2026-11-11 att
  # publiceringen inte hittade paketet.
  bygg:
    needs: uppdatera
    # Matchbevakningen publicerar bara när den faktiskt hittat något nytt
    if: ${{ !failure() && !cancelled() && needs.uppdatera.outputs.kor != 'false' && (needs.uppdatera.outputs.bevaka != 'true' || needs.uppdatera.outputs.andrat == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Samla sidans filer och bygg serie- och lagsidor
        run: |
          mkdir _site
          cp -r index.html om.html favicon.svg og.png fonts data manifest.webmanifest sw.js ikoner logos _site/
          python3 bygg_sidor.py --ut _site
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicera:
    needs: bygg
    # Bara om bygget faktiskt körde - annars (t.ex. kvällsschemat för fel UTC-timme, där bygget
    # hoppas över) letar publiceringen efter ett paket som inte finns och körningen blir röd.
    if: ${{ !cancelled() && needs.bygg.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

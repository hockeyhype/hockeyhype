# Hämtar färsk data från stats.swehockey.se varje morgon, sparar index.html och publicerar sidan.
# Körs även vid push till main (publicerar bara) och kan startas för hand under Actions -> Run workflow.
name: Daglig uppdatering

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 06:00 vintertid / 07:00 sommartid
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: hockeyhype
  cancel-in-progress: false

jobs:
  uppdatera:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Europe/Stockholm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta data och uppdatera sidan
        run: python dagligen.py --sida index.html
      - name: Spara ändringar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Inga ändringar."
          else
            git commit -m "Daglig uppdatering $(date +%F)"
            git push
          fi

  # Bygget och publiceringen ar separata jobb (som i GitHubs egen mall): da hinner det uppladdade
  # paketet registreras innan publiceringen letar efter det. I samma jobb hande det 2026-11-11 att
  # publiceringen inte hittade paketet.
  bygg:
    needs: uppdatera
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Samla sidans filer och bygg serie- och lagsidor
        run: |
          mkdir _site
          cp -r index.html om.html favicon.svg og.png fonts _site/
          python3 bygg_sidor.py --ut _site
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicera:
    needs: bygg
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

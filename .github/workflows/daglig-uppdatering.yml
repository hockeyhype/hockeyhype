# Hämtar färsk data från stats.swehockey.se varje morgon och kväll, sparar index.html och publicerar sidan.
# Körs även vid push till main (publicerar bara) och kan startas för hand under Actions -> Run workflow.
name: Daglig uppdatering

on:
  schedule:
    - cron: "0 5 * * *"     # morgon: 05:00 UTC = 06:00 vintertid / 07:00 sommartid
    # Kväll: kl 22 svensk tid på vardagar och kl 20 på helger. GitHub räknar i UTC utan sommartid,
    # så båda UTC-timmarna schemaläggs och steget "Kontrollera tiden" släpper bara igenom den rätta.
    - cron: "0 20 * * 1-5"  # 22:00 sommartid
    - cron: "0 21 * * 1-5"  # 22:00 vintertid
    - cron: "0 18 * * 0,6"  # 20:00 sommartid
    - cron: "0 19 * * 0,6"  # 20:00 vintertid
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: hockeyhype
  cancel-in-progress: false

jobs:
  uppdatera:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Europe/Stockholm
    outputs:
      kor: ${{ steps.tid.outputs.kor }}
    steps:
      - name: Kontrollera tiden
        id: tid
        env:
          SCHEMA: ${{ github.event.schedule }}
        run: |
          kor=true
          if [ "${{ github.event_name }}" = schedule ] && [ "$SCHEMA" != "0 5 * * *" ]; then
            utc=$(echo "$SCHEMA" | awk '{print $2}')
            forskjutning=$((10#$(date +%z | cut -c2-3)))   # 1 vintertid, 2 sommartid
            lokal=$((utc + forskjutning))
            if [ "$(date +%u)" -le 5 ]; then onskad=22; else onskad=20; fi
            [ "$lokal" -eq "$onskad" ] || kor=false
            echo "Schema $SCHEMA = kl $lokal svensk tid, kvällskörningen ska vara kl $onskad: kör=$kor"
          fi
          echo "kor=$kor" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.tid.outputs.kor == 'true'
      - uses: actions/setup-python@v5
        if: steps.tid.outputs.kor == 'true'
        with:
          python-version: "3.12"
      - name: Hämta data från swehockey
        if: steps.tid.outputs.kor == 'true'
        env:
          SCHEMA: ${{ github.event.schedule }}
        run: |
          # Måndagsmorgonen och körningar startade för hand hämtar allt; övriga bara det som kan ha ändrats
          if [ "${{ github.event_name }}" = workflow_dispatch ] || { [ "$SCHEMA" = "0 5 * * *" ] && [ "$(date +%u)" = 1 ]; }; then
            python dagligen.py --full
          else
            python dagligen.py
          fi
      - name: Spara ändringar
        if: steps.tid.outputs.kor == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Inga ändringar."
          else
            git commit -m "Daglig uppdatering $(date '+%F %H:%M')"
            git push
          fi

  # Bygget och publiceringen ar separata jobb (som i GitHubs egen mall): da hinner det uppladdade
  # paketet registreras innan publiceringen letar efter det. I samma jobb hande det 2026-11-11 att
  # publiceringen inte hittade paketet.
  bygg:
    needs: uppdatera
    if: ${{ !failure() && !cancelled() && needs.uppdatera.outputs.kor != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Samla sidans filer och bygg serie- och lagsidor
        run: |
          mkdir _site
          cp -r index.html om.html favicon.svg og.png fonts data _site/
          python3 bygg_sidor.py --ut _site
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicera:
    needs: bygg
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#F1F2F6;
  --surface:#FFFFFF;
  --surface-2:#E7E9F0;
  --surface-3:#DADDE9;
  --border:#D0D4E2;
  --text:#141B2E;
  --text-muted:#555F7A;
  --text-faint:#848EAA;
  --accent:#8E2430;
  --accent-strong:#6E1B25;
  --accent-soft:#F4DEE1;
  --accent-ink:#4A1219;
  --banner-bg:#182640;
  --banner-hover:#22345A;
  --banner-ink:#FFFFFF;
  --banner-pin:#E0576A;
  --rail-bg:#182640;
  --rail-ink:#FFFFFF;
  --rail-muted:#AEB8D6;
  --rail-hover:#22345A;
  --thead-bg:#F4DEE1;
  --thead-soft:#FAEDEF;
  --u15-chip-bg:#293B63;--u15-chip-ink:#FFFFFF;
  --u16-chip-bg:#8E2430;--u16-chip-ink:#FFFFFF;
  --u18-chip-bg:#8A6D1F;--u18-chip-ink:#FFFFFF;
  --navy:#182640;
  --navy-soft:#E1E5F0;
  --u15:#293B63;
  --u15-soft:#E1E5F0;
  --u16:#8E2430;
  --u16-soft:#F4DEE1;
  --u18:#8A6D1F;
  --u18-soft:#F3ECD3;
  --shadow:0 1px 2px rgba(20,27,46,.07),0 8px 24px -12px rgba(20,27,46,.2);
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1220;
    --surface:#141C30;
    --surface-2:#1B2440;
    --surface-3:#242F52;
    --border:#2E3A5E70;
    --text:#EBEEF6;
    --text-muted:#9AA3C0;
    --text-faint:#69739A;
    --accent:#E0576A;
    --accent-strong:#EC7C8B;
    --accent-soft:#3B1620;
    --accent-ink:#F6C9CF;
    --banner-bg:#3B1620;
    --banner-hover:#4A1C28;
    --banner-ink:#F6C9CF;
    --banner-pin:#EC7C8B;
    --rail-bg:var(--surface);
    --rail-ink:var(--text);
    --rail-muted:var(--text-muted);
    --rail-hover:var(--surface-2);
    --thead-bg:var(--surface-2);
    --thead-soft:transparent;
    --u15-chip-bg:var(--u15-soft);--u15-chip-ink:var(--u15);
    --u16-chip-bg:var(--u16-soft);--u16-chip-ink:var(--u16);
    --u18-chip-bg:var(--u18-soft);--u18-chip-ink:var(--u18);
    --navy:#AEBEEA;
    --navy-soft:#232E52;
    --u15:#9DB0E8;
    --u15-soft:#212C50;
    --u16:#EC8A96;
    --u16-soft:#3B1620;
    --u18:#D9B24C;
    --u18-soft:#3A2F12;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1220;
  --surface:#141C30;
  --surface-2:#1B2440;
  --surface-3:#242F52;
  --border:#2E3A5E70;
  --text:#EBEEF6;
  --text-muted:#9AA3C0;
  --text-faint:#69739A;
  --accent:#E0576A;
  --accent-strong:#EC7C8B;
  --accent-soft:#3B1620;
  --accent-ink:#F6C9CF;
  --banner-bg:#3B1620;
  --banner-hover:#4A1C28;
  --banner-ink:#F6C9CF;
  --banner-pin:#EC7C8B;
  --rail-bg:var(--surface);
  --rail-ink:var(--text);
  --rail-muted:var(--text-muted);
  --rail-hover:var(--surface-2);
  --thead-bg:var(--surface-2);
  --thead-soft:transparent;
  --u15-chip-bg:var(--u15-soft);--u15-chip-ink:var(--u15);
  --u16-chip-bg:var(--u16-soft);--u16-chip-ink:var(--u16);
  --u18-chip-bg:var(--u18-soft);--u18-chip-ink:var(--u18);
  --navy:#AEBEEA;
  --navy-soft:#232E52;
  --u15:#9DB0E8;
  --u15-soft:#212C50;
  --u16:#EC8A96;
  --u16-soft:#3B1620;
  --u18:#D9B24C;
  --u18-soft:#3A2F12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14.5px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:"Oswald",system-ui,sans-serif;
  font-weight:600;
  letter-spacing:.01em;
  text-wrap:balance;
  margin:0;
}
.num{font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font:inherit;color:inherit;}
::selection{background:var(--accent-soft);color:var(--accent-ink);}

.app{max-width:1440px;margin:0 auto;padding:20px 20px 56px;}

/* ---------- Topbar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;flex-wrap:wrap;
  padding-bottom:16px;margin-bottom:16px;
  border-bottom:2px solid var(--accent);
}
.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer;border-radius:10px;transition:opacity .15s;}
.brand:hover{opacity:.85;}
.brand:focus-visible{outline:2px solid var(--accent);outline-offset:4px;}
.brand .puck{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:50%;
  background:var(--accent);color:#fff;
  font-family:"Oswald";font-size:13px;font-weight:700;
  transform:translateY(2px);
}
.brand h1{font-size:30px;line-height:1;}
.wordmark{font-family:"Oswald";font-weight:700;letter-spacing:0;color:var(--text);}
.wordmark .wm-hype{color:var(--accent);}
.wordmark .wm-se{color:var(--text-faint);font-weight:500;font-size:.6em;}
.brand .tag{margin-top:5px;}
.brand .tag{color:var(--text-muted);font-size:13px;font-family:"Karla";font-weight:500;}
.season-tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:999px;}
.season-tabs button{
  border:0;background:transparent;padding:8px 16px;border-radius:999px;
  font-family:"Oswald";font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  color:var(--text-muted);cursor:pointer;transition:background .15s,color .15s;
}
.season-tabs button.active{background:var(--accent);color:#fff;box-shadow:var(--shadow);}
.season-tabs button.active .dot{background:#fff;}
.season-tabs button .dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--u15);
  margin-right:7px;position:relative;top:-1px;
}
.season-tabs button .dot.live{background:var(--accent);}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:start;}
@media (max-width:860px){.layout{grid-template-columns:1fr;}}

/* ---------- Filter rail ---------- */
.rail{
  background:var(--rail-bg);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;position:sticky;top:calc(var(--topbar-h, 77px) + 16px);
}
.rail h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--rail-muted);font-family:"Karla";font-weight:700;margin-bottom:10px;}
.mobile-filter-toggle{display:none;}
.search-box{position:relative;flex:1 1 240px;max-width:380px;min-width:160px;}
.search-box input{
  width:100%;padding:9px 32px 9px 32px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);font-family:"Karla";font-size:13.5px;
}
.search-box input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-faint);pointer-events:none;}
.search-box .clear-btn{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border:0;border-radius:50%;background:var(--surface-3);color:var(--text-muted);
  font-size:13px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;
}
.search-box .clear-btn:hover{background:var(--border);color:var(--text);}
.search-box.has-value .clear-btn{display:flex;}
.rail-actions{display:flex;gap:8px;margin-bottom:14px;}
.rail-actions button{
  flex:1;border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);
  padding:6px 8px;border-radius:7px;font-size:11.5px;font-weight:600;cursor:pointer;
  text-transform:uppercase;letter-spacing:.03em;
}
.rail-actions button:hover{color:var(--text);border-color:var(--text-faint);}

/* Vy-valen ligger lodratt i vanstermenyn, filtren som en rad i summary-baren */
.view-rail{flex-direction:column;background:transparent;padding:0;gap:3px;}
.view-rail button{text-align:left;padding:9px 12px;font-size:14px;border-radius:7px;color:var(--rail-muted);}
.view-rail button:not(.active):not(:disabled):hover{background:var(--rail-hover);color:var(--rail-ink);}
.filter-panel{flex:1 1 560px;min-width:0;}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:flex-end;}
.filter-bar .filter-group{margin-bottom:0;width:140px;}
.filter-bar .dropdown-panel{min-width:250px;}
.filter-bar .filter-group:nth-last-child(-n+3) .dropdown-panel{left:auto;right:0;}
.filter-bar .rail-actions{flex-direction:column;gap:3px;margin-bottom:0;}
.filter-bar .rail-actions button{padding:3px 8px;font-size:10.5px;}
#emptyHint:empty{display:none;}
#emptyHint{text-align:right;}
@media (max-width:640px){ .rail{display:none;} } /* vy-valen finns i bottombaren pa mobil */

.filter-group{margin-bottom:10px;}
.filter-group:last-child{margin-bottom:0;}
.filter-group > .flabel{
  font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);
  font-weight:700;margin-bottom:5px;display:block;
}
.dropdown{position:relative;}
.dropdown-toggle{
  width:100%;display:flex;align-items:center;gap:8px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  padding:9px 10px;border-radius:8px;cursor:pointer;font-family:"Karla";font-size:13.5px;text-align:left;
}
.dropdown-toggle:hover{border-color:var(--text-faint);}
.dropdown.open .dropdown-toggle{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.dropdown-toggle .dt-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dropdown-toggle .chev{color:var(--text-faint);font-size:10px;transition:transform .15s;flex:none;}
.dropdown.open .dropdown-toggle .chev{transform:rotate(180deg);}
.dropdown-toggle:disabled{opacity:.5;cursor:not-allowed;}
.dropdown-panel{
  display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:45;
  background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);
  padding:6px;max-height:min(70vh,560px);overflow:auto;
}
.dropdown.open .dropdown-panel{display:block;}
.dropdown-panel .dp-actions{display:flex;gap:6px;padding:4px 4px 8px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.dropdown-panel .dp-actions button{
  flex:1;border:0;background:var(--surface-2);color:var(--text-muted);padding:5px 6px;border-radius:6px;
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;
}
.dropdown-panel .dp-actions button:hover{color:var(--text);}
.dp-item{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:6px;cursor:pointer;}
.dp-item:hover{background:var(--surface-2);}
.dp-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);flex:none;cursor:pointer;}
.chip{
  font-family:"Oswald";font-size:10.5px;font-weight:600;letter-spacing:.03em;
  padding:1px 6px;border-radius:5px;flex:none;
}
.chip-u15{background:var(--u15-chip-bg);color:var(--u15-chip-ink);}
.chip-u16{background:var(--u16-chip-bg);color:var(--u16-chip-ink);}
.chip-u18{background:var(--u18-chip-bg);color:var(--u18-chip-ink);}
/* I de morkbla rubrikraderna anvands de ljusa varianterna, annars smalter U15-etiketten in */
.standings-card h4 .chip-u15{background:var(--u15-soft);color:var(--u15);}
.standings-card h4 .chip-u16{background:var(--u16-soft);color:var(--u16);}
.standings-card h4 .chip-u18{background:var(--u18-soft);color:var(--u18);}
.chip-favorit{background:var(--navy-soft);color:var(--navy);}
.dp-item .label{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dp-item .count{font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums;flex:none;}
.empty-hint{
  font-size:12px;color:var(--text-faint);padding:8px 2px;font-style:italic;
}

/* ---------- Main ---------- */
.summary-bar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin-bottom:14px;
}
.summary-stats{display:flex;gap:22px;flex-wrap:wrap;}
.summary-stats .stat{display:flex;flex-direction:column;gap:1px;border-left:3px solid var(--accent);padding-left:9px;}
.summary-stats .stat .n{font-family:"Oswald";font-size:22px;font-weight:600;}
.summary-stats .stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);}
.view-toggle{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:8px;}
.view-toggle button{
  border:0;background:transparent;padding:7px 14px;border-radius:6px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--text-muted);
}
.view-toggle button.active{background:var(--accent);color:#fff;box-shadow:var(--shadow);}
.view-toggle button:disabled{opacity:.4;cursor:not-allowed;}

.table-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;
}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:640px;}
thead th{
  position:sticky;top:0;background:var(--thead-bg);z-index:1;
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);
  font-family:"Karla";font-weight:700;padding:10px 12px;border-bottom:2px solid var(--accent);
  cursor:pointer;white-space:nowrap;user-select:none;
}
thead th.num-col{text-align:right;}
thead th .arrow{opacity:0;margin-left:3px;font-size:10px;}
thead th.sorted .arrow{opacity:1;color:var(--accent);}
thead th:hover{color:var(--text);}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle;}
tbody td.num-col{text-align:right;}
tbody tr{cursor:pointer;}
tbody tr:hover td{background:var(--surface-2);}
tbody tr:last-child td{border-bottom:0;}
.rk{color:var(--text-faint);width:1%;}
.name-cell{display:flex;flex-direction:column;gap:1px;}
td.col-lag:hover{text-decoration:underline;text-underline-offset:2px;color:var(--accent-strong);}
.name-cell .full{font-weight:600;}
.name-cell .sub{font-size:11.5px;color:var(--text-muted);}
.lag-cell{display:flex;align-items:center;gap:7px;min-width:0;}
.lag-logo{width:20px;height:20px;border-radius:50%;object-fit:contain;flex:none;background:var(--surface-2);}
.lag-logo-fallback{
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-family:"Oswald";font-size:8px;font-weight:700;letter-spacing:.01em;
}
.lag-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pos-badge{
  display:inline-block;font-family:"Oswald";font-size:10.5px;font-weight:600;
  background:var(--surface-3);color:var(--text-muted);padding:1px 6px;border-radius:4px;
}
.tp-cell{font-weight:700;color:var(--accent-strong);}
.detail-row td{
  background:var(--surface-2);padding:12px 16px 14px 40px;font-size:12.5px;color:var(--text-muted);
}
.detail-row .breakdown{display:flex;flex-direction:column;gap:5px;margin-top:6px;}
.detail-row .b-row{display:flex;gap:14px;align-items:baseline;}
.detail-row .b-row .serie{flex:1;color:var(--text);font-weight:600;}
.detail-row .b-row .stats{font-variant-numeric:tabular-nums;color:var(--text-muted);}
.malvakt-grans-row td{
  padding:7px 12px;font-size:11px;font-style:italic;color:var(--text-faint);
  background:var(--surface-2);border-bottom:1px solid var(--border);cursor:default;
}
.empty-state{padding:48px 24px;text-align:center;color:var(--text-muted);}
.empty-state .big{font-family:"Oswald";font-size:16px;color:var(--text);margin-bottom:6px;}

/* ---------- Tabell (standings) ---------- */
.standings-kategori{margin-bottom:22px;}
.standings-kategori:last-child{margin-bottom:0;}
.standings-kategori h3{
  font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);
  margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.standings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;}
.standings-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
}
.standings-card h4{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  font-family:"Karla";font-size:13px;font-weight:700;padding:10px 12px;
  border-bottom:1px solid var(--border);background:var(--banner-bg);color:var(--banner-ink);
  border-left:3px solid var(--accent);
}
.standings-card h4:hover{background:var(--banner-hover);}
.standings-card h4 .serie-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.standings-card h4 .serie-updated{
  flex:none;font-size:10.5px;font-weight:600;color:var(--banner-ink);opacity:.7;white-space:nowrap;
}
.pin-btn{
  flex:none;border:0;background:transparent;cursor:pointer;padding:0 0 0 2px;
  font-size:16px;line-height:1;color:var(--accent-ink);opacity:.5;
}
.pin-btn:hover{opacity:1;}
.pin-btn.active{opacity:1;color:var(--accent-strong);}
.standings-card h4 .pin-btn{color:var(--banner-ink);}
.standings-card h4 .pin-btn.active{color:var(--banner-pin);}
.standings-card table{width:100%;border-collapse:collapse;min-width:0;}
.standings-card th{
  text-align:right;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-faint);
  font-weight:700;padding:6px 8px;background:var(--thead-soft);
}
.standings-card th:first-child,.standings-card th:nth-child(2){text-align:left;}
.standings-card td{padding:6px 8px;font-size:12.5px;text-align:right;border-top:1px solid var(--border);}
.standings-card td:first-child{text-align:left;color:var(--text-faint);width:1%;}
.standings-card td:nth-child(2){text-align:left;font-weight:600;}
.standings-card tr.leader td{color:var(--accent-strong);}
.standings-card .tp{font-weight:700;color:var(--accent-strong);}
.standings-card .gd-pos{color:var(--u15);}
.standings-card .gd-neg{color:var(--accent);}
/* Fasta, smala sifferkolumner: siffrorna far alltid plats och langa lagnamn bryts i stallet */
.standings-card table{table-layout:fixed;}
.standings-card th:not(:nth-child(2)),.standings-card td:not(:nth-child(2)){padding-left:4px;padding-right:4px;}
.standings-card th:nth-child(1){width:22px;}
.standings-card th:nth-child(n+3){width:20px;}
.standings-card th:nth-child(7){width:30px;}
.standings-card td:nth-child(2){overflow:hidden;}
.standings-card .lag-cell{min-width:0;}
.standings-card .lag-text{white-space:normal;overflow-wrap:anywhere;line-height:1.25;}

/* ---------- Serievy ---------- */
.serie-vy-header{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;
  padding-bottom:14px;border-bottom:2px solid var(--accent);
}
.serie-vy-header h2{font-size:19px;flex:1;min-width:0;}
.serie-vy-updated{font-size:12px;color:var(--text-faint);white-space:nowrap;}
.serie-vy-header .pin-btn{font-size:20px;color:var(--accent-strong);}
.serie-vy section{margin-bottom:24px;}
.match-section h3, .serie-vy-poanglista h3{
  font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);
  font-family:"Karla";font-weight:700;margin-bottom:10px;
}
.match-section{margin-bottom:22px;}
.match-list{display:flex;flex-direction:column;gap:8px;}
.match-row{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 14px;
}
.match-date{
  flex:none;font-size:11.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;
  min-width:64px;
}
.match-teams{display:flex;align-items:center;gap:10px;flex:1;min-width:220px;}
.match-team{display:flex;align-items:center;gap:6px;flex:1;min-width:0;}
.match-team:last-child{flex-direction:row-reverse;text-align:right;}
.match-team-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600;}
.match-score{
  flex:none;font-family:"Oswald";font-size:14px;font-weight:700;color:var(--accent-strong);
  min-width:44px;text-align:center;
}
.match-score.tbd{color:var(--text-faint);font-weight:600;font-size:11px;text-transform:uppercase;}
.match-venue{flex:none;font-size:11px;color:var(--text-faint);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.serie-vy-tabell{margin-bottom:24px;}
.serie-vy-poanglista .table-card{margin:0;}

/* ---------- Lagvy (klick pa ett lag: kommande matcher, serietabell, senaste
   resultat, intern poangliga - i den ordningen) ---------- */
.lag-vy-block{margin-bottom:22px;}
.lag-vy-block:last-child{margin-bottom:0;}
.lag-vy-serie-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.lag-vy-serie-namn{font-family:"Karla";font-size:13px;font-weight:700;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lag-vy-header .lag-vy-namn{display:flex;align-items:center;gap:8px;}
.lag-vy-header .lag-vy-namn .lag-logo{width:26px;height:26px;}
.lag-vy-header .lag-vy-namn .lag-logo-fallback{font-size:10px;}

.footnote{
  margin-top:16px;padding-top:14px;border-top:2px solid var(--accent); /* samma avskiljare som topbaren/bottombaren */
  font-size:12px;color:var(--text-faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.footnote a{color:var(--text-muted);text-decoration:underline;text-underline-offset:2px;}

@media (max-width:640px){
  .app{padding:14px 12px 40px;}
  .brand h1{font-size:24px;}
  table{min-width:520px;}
  .search-box{flex-basis:100%;max-width:none;order:3;}
  .season-tabs{order:2;}
  /* Under 16px triggerar iOS Safari automatisk inzoomning nar man trycker i faltet -
     sidan blir kvar inzoomad efterat, vilket forstor bade layouten och skrollningen
     till traffarna. 16px racker for att undvika det helt. */
  .search-box input{font-size:16px;}
}

/* ---------- Fastnalad bottombar (bara mobil) - snabbnavigering + uppdaterad-info,
   sa man slipper scrolla hela vagen upp for att byta vy eller se nar datan hamtades ---------- */
.bottom-bar{display:none;}
@media (max-width:640px){
  .app{padding-bottom:88px;} /* plats at den fastnalade bottombaren, annars dolts sista raderna bakom den */
  .bottom-bar{
    display:flex;flex-direction:column;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--surface);border-top:2px solid var(--accent); /* samma avskiljare som topbarens border-bottom */
    box-shadow:0 -6px 16px -8px rgba(20,27,46,.2);
  }
  .bottom-bar-nav{background:transparent;padding:6px 6px 4px;border-radius:0;gap:2px;}
  .bottom-bar-nav button{flex:1;padding:7px 2px;font-size:10.5px;}
  .bottom-bar-footer{
    padding:0 12px 8px;font-size:10px;color:var(--text-faint);text-align:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
}

/* ---------- Fastnalade toppbanner + flikvaljare (endast pa bredare skarmar - pa
   mobilen ar filterpanelen redan hopfallbar/icke-fastnalad, se blocket nedanfor,
   och en fastnalad toppsektion dar skulle ta for stor del av skarmen) ---------- */
@media (min-width:861px){
  .topbar{position:sticky;top:0;z-index:30;background:var(--bg);}
  .summary-bar{
    position:sticky;z-index:15;background:var(--bg);
    top:calc(var(--topbar-h, 77px) + 16px);
    padding:10px 0;margin:-10px 0 4px;
  }
}

/* ---------- Mobil filterpanel ---------- */
@media (max-width:860px){
  .rail{position:static;} /* fastnar inte langre nar man scrollar - blockerade tabellen pa mobil */
  .rail{padding:4px;}
  .rail > h2{display:none;}
  .view-rail{flex-direction:row;}
  .view-rail button{flex:1;text-align:center;padding:8px 4px;font-size:13px;}
  .mobile-filter-toggle{
    display:flex;align-items:center;justify-content:space-between;width:100%;
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    padding:11px 12px;margin-bottom:0;cursor:pointer;
    font-family:"Oswald";font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
    color:var(--text);
  }
  .mobile-filter-toggle .chev{color:var(--text-faint);font-size:11px;transition:transform .15s;}
  .filter-panel{flex-basis:100%;}
  .filter-panel.expanded .mobile-filter-toggle{border-color:var(--accent);}
  .filter-panel.expanded .mobile-filter-toggle .chev{transform:rotate(180deg);}
  #filterBody{display:none;margin-top:10px;}
  .filter-panel.expanded #filterBody{display:block;}
  .filter-bar{display:grid;grid-template-columns:1fr 1fr;justify-content:stretch;}
  .filter-bar .filter-group{width:auto;}
  .filter-bar .rail-actions{grid-column:1 / -1;flex-direction:row;gap:8px;}
  .filter-bar .rail-actions button{padding:6px 8px;font-size:11.5px;}
  .filter-bar .dropdown-panel{min-width:0;}
}

/* ---------- Kompakt lage pa sma telefoner ---------- */
@media (max-width:480px){
  .app{padding:10px 8px 32px;padding-bottom:88px;}
  .summary-stats{gap:14px;}
  .summary-stats .stat .n{font-size:18px;}
  table{min-width:0;} /* lat tabellen krympa till skarmens bredd i stallet for att tvinga sidledsskroll */
  thead th{padding:7px 6px;font-size:9.5px;}
  tbody td{padding:6px 6px;font-size:12px;}
  .detail-row td{padding:10px 10px 10px 16px;}
  /* Dolj de minst kritiska kolumnerna - fullstandig data finns fortfarande vid stapelvis eller pa dator */
  .col-rk,.col-pos,.col-fodelsear,.col-pim,.col-kategori{display:none;}
  /* Malvakt-vyn har fler kolumner an de andra - dolj de rakuppgifter som ocksa syns i
     procent/snitt-form (SVS%/GAA), sa GP/SVS%/GAA/SO/W/L far plats. */
  .col-ga,.col-sog,.col-svs{display:none;}
  .name-cell .full{font-size:12.5px;}
  .pos-badge{font-size:9.5px;padding:1px 5px;}
  /* Lagnamnet ersatts av bara logotypen/initialbrickan - fullstandigt namn finns i title-attributet
     (langtryck/hovra) och pa storre skarmar - annars far Lag-kolumnen inte plats bredvid siffrorna */
  .lag-text{display:none;}
  .lag-logo{width:22px;height:22px;font-size:8.5px;}

  .standings-grid{grid-template-columns:1fr;gap:10px;}
  .standings-card th{padding:5px 5px;font-size:9.5px;}
  .standings-card td{padding:5px 5px;font-size:11.5px;}
  .standings-card h4{padding:8px 10px;font-size:12px;}
  .match-venue{display:none;}
  .match-team-name{font-size:12px;}
  .serie-vy-header h2{font-size:16px;}
}
</style>

function hamtaFavoriter(){
  try { return new Set(JSON.parse(localStorage.getItem('hockeykoll_favoritserier') || '[]')); }
  catch(e){ return new Set(); }
}
function sparaFavoriter(){
  try { localStorage.setItem('hockeykoll_favoritserier', JSON.stringify([...favoritSerier])); }
  catch(e){ /* privat lage e.d. - strunta i att spara */ }
}
let favoritSerier = hamtaFavoriter(); // Set av grupp-id (nålade favoritserier), sparas per webblasare

  if (favoritSerier.has(id)) favoritSerier.delete(id); else favoritSerier.add(id);

  renderTable();
}

  if (delar.length !== 3) return iso;
  const m = parseInt(delar[1], 10);
  return `${parseInt(delar[2],10)} ${MANADER_KORT[m-1] || ''}`;
}
// Matcher fran ScheduleAndResults har antingen "YYYY-MM-DD" (spelade) eller
// "YYYY-MM-DD HH:MM" (kommande - tiden ar "00:00" nar den annu inte ar bekraftad).
function formatMatchDatum(raw){
  if (!raw) return '';
  const [datum, tid] = raw.split(' ');
  const bas = formatDatumKort(datum);
  return (tid && tid !== '00:00') ? `${bas}, ${tid}` : bas;
}

function seasonList(){ return Object.keys(RAW).sort().reverse(); } // senaste sasongen forst

function kategoriChipClass(kat){
  if (kat === 'U15P') return 'chip-u15';
  if (kat === 'U16P') return 'chip-u16';
  return 'chip-u18'; // U18H och eventuella framtida kategorier
}

/* ============================================================
   LAGLOGOTYPER (Tabell- och Spelarevyn) - ersatter lagnamnet i mobilen
   sa raderna far plats. LOGOTYPER/LAG_TILL_KLUBB kommer fran den
   engangs-hamtning som beskrivs i kommentaren ovanfor deras deklaration.
   Ett lag utan traff far istallet en genererad initialbricka, sa alla
   lag - aven de vi inte hunnit koppla en logga till annu - far en kompakt
   visuell identitet i mobilen.
   ============================================================ */
const INITIAL_FARGER = ['#293B63','#8E2430','#8A6D1F','#1F6B5C','#5B3E96','#B15A1F','#1F6B8A','#6B1F5E'];
function fargForLag(lagNamn){
  let hash = 0;
  for (let i = 0; i < lagNamn.length; i++) hash = (hash * 31 + lagNamn.charCodeAt(i)) >>> 0;
  return INITIAL_FARGER[hash % INITIAL_FARGER.length];
}
function initialerForLag(lagNamn){
  // Vid kombinerade lag ("Sundbybergs IK/Solna SK") anvands bara forsta klubbnamnet
  const ord = lagNamn.split('/')[0].trim().split(/\s+/).filter(Boolean);
  if (ord.length === 0) return '?';
  if (ord.length === 1) return ord[0].slice(0, 2).toUpperCase();
  return (ord[0][0] + ord[1][0]).toUpperCase();
}
function lagLogoHtml(lagNamn){
  const klubb = LAG_TILL_KLUBB[lagNamn];
  const url = klubb ? LOGOTYPER[klubb] : null;
  if (url) return `<img class="lag-logo" src="${url}" alt="" title="${lagNamn}">`;
  return `<span class="lag-logo lag-logo-fallback" style="background:${fargForLag(lagNamn)}" title="${lagNamn}">${initialerForLag(lagNamn)}</span>`;
}

/* ============================================================
   BUILD FILTER DROPDOWNS (Ålder / Serie / Lag)
   ============================================================ */
function summarizeLabel(selectedCount, totalCount, allLabel, singleLabel){
  if (totalCount === 0) return 'Inga tillgängliga';
  if (selectedCount === 0) return 'Inga valda';
  if (selectedCount === totalCount) return `${allLabel} (${totalCount})`;
  if (selectedCount === 1) return singleLabel();
  return `${selectedCount} av ${totalCount} valda`;
}

function buildDropdown(toggleSel, panelSel, items, opts){
  // items: [{ key, checked, disabled, render(el) }]
  const dd = document.querySelector(toggleSel).closest('.dropdown');
  const toggle = dd.querySelector('.dropdown-toggle .dt-label');
  const panel = dd.querySelector(panelSel);
  panel.innerHTML = '';

  const actions = document.createElement('div');
  actions.className = 'dp-actions';
  const allBtn = document.createElement('button');
  allBtn.type = 'button'; allBtn.textContent = 'Markera allt';
  allBtn.addEventListener('click', () => { opts.onSelectAll(); renderAll(); });
  const noneBtn = document.createElement('button');
  noneBtn.type = 'button'; noneBtn.textContent = 'Avmarkera allt';
  noneBtn.addEventListener('click', () => { opts.onSelectNone(); renderAll(); });
  actions.appendChild(allBtn); actions.appendChild(noneBtn);
  panel.appendChild(actions);

  if (items.length === 0) {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = opts.emptyText || 'Inga alternativ just nu.';
    panel.appendChild(hint);
  }

  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'dp-item';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = item.checked; cb.disabled = !!item.disabled;
    row.appendChild(cb);
    item.render(row);
    row.addEventListener('click', e => { if (e.target !== cb && !cb.disabled) cb.click(); });
    cb.addEventListener('change', () => { item.onChange(cb.checked); renderAll(); });
    panel.appendChild(row);
  });

  const selectedCount = items.filter(i => i.checked).length;
  toggle.textContent = summarizeLabel(selectedCount, items.length, opts.allLabel, () => opts.singleLabel(items.find(i => i.checked)));
}

function renderFilters(){
  const grupper = seasonData().grupper;
  const seasonEmpty = grupper.every(g => g.spelare.length === 0);
  document.getElementById('emptyHint').innerHTML = seasonEmpty
    ? '<div class="empty-hint">Inga matcher spelade ännu den här säsongen &ndash; statistiken fylls på allt eftersom serierna kommer igång.</div>'
    : '';

  const kategorier = [...new Set(grupper.map(g => g.kategori))];

  // ---- Ålder ----
  buildDropdown('#ddAlder .dropdown-toggle', '.dropdown-panel', kategorier.map(kat => ({
    key: kat,
    checked: !excludedKategori.has(kat),
    label: kat === 'U15P' ? 'Pojkar 15 år' : kat === 'U16P' ? 'Pojkar 16 år' : kat === 'U18H' ? 'Herrjuniorer 18 år' : kat,
    render(row){
      const chip = document.createElement('span');
      chip.className = 'chip ' + kategoriChipClass(kat);
      chip.textContent = kat;
      const label = document.createElement('span');
      label.className = 'label'; label.textContent = this.label;
      const count = document.createElement('span');
      count.className = 'count'; count.textContent = grupper.filter(g=>g.kategori===kat).reduce((a,g)=>a+g.spelare.length,0);
      row.appendChild(chip); row.appendChild(label); row.appendChild(count);
    },
    onChange(isChecked){
      if (isChecked) { excludedKategori.delete(kat); grupper.filter(g=>g.kategori===kat).forEach(g => excludedSeries.delete(g.serie)); }
      else excludedKategori.add(kat);
    },
  })), {
    allLabel: 'Alla åldrar',
    singleLabel: item => item.label,
    onSelectAll: () => { kategorier.forEach(k => excludedKategori.delete(k)); grupper.forEach(g => excludedSeries.delete(g.serie)); },
    onSelectNone: () => kategorier.forEach(k => excludedKategori.add(k)),
  });

  // ---- Serie ----
  const relevantGrupper = grupper.filter(g => !excludedKategori.has(g.kategori));
  buildDropdown('#ddSerie .dropdown-toggle', '.dropdown-panel', relevantGrupper.map(g => ({
    key: g.serie,
    checked: !excludedSeries.has(g.serie),
    label: g.serie,
    render(row){
      const label = document.createElement('span');
      label.className = 'label'; label.textContent = g.serie;
      const count = document.createElement('span');
      count.className = 'count'; count.textContent = g.spelare.length;
      row.appendChild(label); row.appendChild(count);
    },
    onChange(isChecked){
      const lagIStock = [...new Set(g.spelare.map(r => r[1]))];
      if (isChecked) { excludedSeries.delete(g.serie); lagIStock.forEach(l => excluded.delete(g.serie+'||'+l)); }
      else excludedSeries.add(g.serie);
    },
  })), {
    allLabel: 'Alla serier',
    singleLabel: item => item.label,
    emptyText: 'Välj minst en ålderskategori ovan.',
    onSelectAll: () => relevantGrupper.forEach(g => {
      excludedSeries.delete(g.serie);
      [...new Set(g.spelare.map(r => r[1]))].forEach(l => excluded.delete(g.serie+'||'+l));
    }),
    onSelectNone: () => relevantGrupper.forEach(g => excludedSeries.add(g.serie)),
  });

  // ---- Lag ----
  // Ett lag kan forekomma i flera serier (t.ex. bade en Bla- och en Rod-grupp) - da ska det
  // anda bara visas som ETT val i filtret. Vi grupperar darfor pa lagnamn och samlar ihop alla
  // serie+lag-nycklar (som exkluderings-sets faktiskt anvander) bakom respektive lagnamn.
  const relevantSerier = relevantGrupper.filter(g => !excludedSeries.has(g.serie));
  const lagNycklarPerNamn = new Map();
  relevantSerier.forEach(g => {
    // Unionen av lag fran bade spelare och malvakter - annars skulle ett lag med enbart
    // en malvakt (och ingen listad utespelare) sakna en egen rad i filtret.
    const lagIGruppen = new Set([...g.spelare.map(r => r[1]), ...(g.malvakter || []).map(r => r[1])]);
    lagIGruppen.forEach(lag => {
      if (!lagNycklarPerNamn.has(lag)) lagNycklarPerNamn.set(lag, []);
      lagNycklarPerNamn.get(lag).push(g.serie+'||'+lag);
    });
  });
  const lagNamn = [...lagNycklarPerNamn.keys()].sort((a,b) => a.localeCompare(b, 'sv'));
  buildDropdown('#ddLag .dropdown-toggle', '.dropdown-panel', lagNamn.map(lag => {
    const nycklar = lagNycklarPerNamn.get(lag);
    return {
      key: lag,
      checked: nycklar.some(k => !excluded.has(k)),
      label: lag,
      render(row){
        row.insertAdjacentHTML('beforeend', lagLogoHtml(lag));
        const label = document.createElement('span');
        label.className = 'label'; label.textContent = lag;
        row.appendChild(label);
      },
      onChange(isChecked){
        if (isChecked) nycklar.forEach(k => excluded.delete(k));
        else nycklar.forEach(k => excluded.add(k));
      },
    };
  }), {
    allLabel: 'Alla lag',
    singleLabel: item => item.label,
    emptyText: 'Välj minst en serie ovan.',
    onSelectAll: () => lagNycklarPerNamn.forEach(nycklar => nycklar.forEach(k => excluded.delete(k))),
    onSelectNone: () => lagNycklarPerNamn.forEach(nycklar => nycklar.forEach(k => excluded.add(k))),
  });

  // ---- Födelseår ----
  const fodelsearSet = new Set();
  relevantSerier.forEach(g => g.spelare.forEach(r => fodelsearSet.add(r[3] || 'Okänt')));
  const fodelsearLista = [...fodelsearSet].sort((a,b) => {
    if (a === 'Okänt') return 1;
    if (b === 'Okänt') return -1;
    return a.localeCompare(b);
  });
  buildDropdown('#ddFodelsear .dropdown-toggle', '.dropdown-panel', fodelsearLista.map(ar => ({
    key: ar,
    checked: !excludedFodelsear.has(ar),
    label: ar,
    render(row){
      const label = document.createElement('span');
      label.className = 'label'; label.textContent = ar;
      row.appendChild(label);
    },
    onChange(isChecked){
      if (isChecked) excludedFodelsear.delete(ar); else excludedFodelsear.add(ar);
    },
  })), {
    allLabel: 'Alla år',
    singleLabel: item => item.label,
    emptyText: 'Välj minst en serie ovan.',
    onSelectAll: () => fodelsearLista.forEach(a => excludedFodelsear.delete(a)),
    onSelectNone: () => fodelsearLista.forEach(a => excludedFodelsear.add(a)),
  });

  // ---- Position ----
  // Fast lista (till skillnad fran Lag/Fodelsear som ar databaserade) - GK racknas som
  // malvakternas position aven fast malvaktsraderna (g.malvakter) saknar ett eget Pos-falt.
  buildDropdown('#ddPosition .dropdown-toggle', '.dropdown-panel', POSITION_LISTA.map(pos => ({
    key: pos,
    checked: !excludedPosition.has(pos),
    label: pos,
    render(row){
      const label = document.createElement('span');
      label.className = 'label'; label.textContent = pos;
      row.appendChild(label);
    },
    onChange(isChecked){
      if (isChecked) excludedPosition.delete(pos); else excludedPosition.add(pos);
    },
  })), {
    allLabel: 'Alla positioner',
    singleLabel: item => item.label,
    onSelectAll: () => POSITION_LISTA.forEach(p => excludedPosition.delete(p)),
    onSelectNone: () => POSITION_LISTA.forEach(p => excludedPosition.add(p)),
  });
}

/* ============================================================
   FILTERED ROWS
   ============================================================ */
function getFilteredRows(tvingaRespekteraFilter){
  // Nar man soker ska ALL data pa sidan vara sokbar, oavsett vilka Alder/Serie/Lag/
  // Fodelsear/Position-filter som rakar vara ikryssade i sidopanelen - annars kan man
  // omedvetet missa traffar bara for att man tidigare snavat in filtren. Sok-textens egen
  // matchesSearch-filtrering (som anropas separat pa varje anropsstalle) star kvar som den
  // enda begransningen sa lange search ar ifylld.
  // Undantag: Serie-/Lag-vyerna anvander SAMMA filter-set for att avgransa till just den
  // serien/laget (satt av filtreraPaSerie/filtreraPaLag) - dar ar filtren sidans egentliga
  // navigering, inte nagot att bortse fran, sa de anropar med tvingaRespekteraFilter=true.
  const sokaktiv = !tvingaRespekteraFilter && !!search;
  const grupper = seasonData().grupper;
  const rows = [];
  grupper.forEach(g => {
    if (!sokaktiv) {
      if (excludedKategori.has(g.kategori)) return;
      if (excludedSeries.has(g.serie)) return;
    }
    g.spelare.forEach(r => {
      const key = g.serie+'||'+r[1];
      if (!sokaktiv) {
        if (excluded.has(key)) return;
        if (excludedFodelsear.has(r[3] || 'Okänt')) return;
        if (excludedPosition.has(r[2])) return;
      }
      rows.push({ serie:g.serie, kategori:g.kategori, name:r[0], lag:r[1], pos:r[2], fodelsear:r[3], gp:r[4], g:r[5], a:r[6], tp:r[7], pim:r[8] });
    });
  });
  return rows;
}

// Malvaktsraderna ar [Namn,Lag,Fodelsear,GPT,GKD,GPI,MIP,GA,SVS,SOG,SVS%,GAA,SO,W,L] -
// samma Alder/Serie/Lag/Fodelsear-filter som utespelarna anvander, eftersom det ar samma
// grund-uppsattning (kategori/serie/lag-nyckel).
function getFilteredGkRows(){
  const sokaktiv = !!search;
  if (!sokaktiv && excludedPosition.has('GK')) return []; // malvakter racknas alltid som position GK
  const grupper = seasonData().grupper;
  const rows = [];
  grupper.forEach(g => {
    if (!sokaktiv) {
      if (excludedKategori.has(g.kategori)) return;
      if (excludedSeries.has(g.serie)) return;
    }
    (g.malvakter || []).forEach(r => {
      const key = g.serie+'||'+r[1];
      if (!sokaktiv) {
        if (excluded.has(key)) return;
        if (excludedFodelsear.has(r[2] || 'Okänt')) return;
      }
      rows.push({
        serie:g.serie, kategori:g.kategori, name:r[0], lag:r[1], fodelsear:r[2],
        gpi:r[5], mip:r[6], ga:r[7], svs:r[8], sog:r[9], so:r[12], w:r[13], l:r[14],
      });
    });
  });
  return rows;
}

function matchesSearch(text){
  if (!search) return true;
  // Namnen lagras som "Efternamn, Förnamn" - varje sökord matchas därför för sig, i valfri
  // ordning, så att t.ex. "emil esh" hittar "Eshammar, Emil".
  const t = text.toLowerCase().replace(/,/g, ' ');
  return search.toLowerCase().replace(/,/g, ' ').split(/\s+/).filter(Boolean).every(ord => t.includes(ord));
}

function filtreraPaLag(lagNamn, serieNamn){
  // Lagnamn ar bara unika INOM en serie (tva olika lag i tva olika serier kan raka heta
  // t.ex. "AIK") - darfor maste vi veta VILKEN serie klicket kom ifran, annars riskerar vi
  // att blanda ihop flera olika lag som bara rakar dela namn.
  if (!serieNamn) {
    // Fallback om anropsstallet undantagsvis inte kanner till serien annu: leta upp forsta
    // serien dar namnet forekommer (bast-mojliga gissning, men bor i princip aldrig hända).
    const traff = seasonData().grupper.find(g => {
      const lagISerien = new Set([...g.spelare.map(r => r[1]), ...(g.malvakter || []).map(r => r[1])]);
      return lagISerien.has(lagNamn);
    });
    serieNamn = traff ? traff.serie : null;
  }
  // Kryssar bara i "serieNamn||lagNamn" i Lag-filtret (Ålder/Serie lämnas orörda) och hoppar
  // till Lag-vyn (kommande matcher, serietabell, senaste resultat, intern poängliga for just
  // det laget) - precis som att ha filtrerat fram det for hand, fast med matcher/tabell pa kopet.
  const grupper = seasonData().grupper;
  grupper.forEach(g => {
    const lagIGruppen = new Set([...g.spelare.map(r => r[1]), ...(g.malvakter || []).map(r => r[1])]);
    lagIGruppen.forEach(lag => {
      const key = g.serie + '||' + lag;
      if (g.serie === serieNamn && lag === lagNamn) excluded.delete(key);
      else excluded.add(key);
    });
  });
  search = '';
  searchInputEl.value = '';
  searchBoxEl.classList.remove('has-value');
  expandedRow = null;
  fokusLag = lagNamn;
  fokusSerie = serieNamn;
  bytVy('lagdetalj');
  renderAll();
}

function filtreraPaSerie(g){
  // Sakerstaller att bara denna serie ar vald (oavsett vilken ålderskategori den tillhor)
  // och hoppar till Serie-vyn - precis som filtreraPaLag men pa serienivo.
  const grupper = seasonData().grupper;
  excludedKategori.delete(g.kategori);
  grupper.forEach(gr => {
    if (gr.serie === g.serie) excludedSeries.delete(gr.serie);
    else excludedSeries.add(gr.serie);
  });
  search = '';
  searchInputEl.value = '';
  searchBoxEl.classList.remove('has-value');
  expandedRow = null;
  bytVy('serie');
  renderAll();
}

/* ============================================================
   AGGREGATION
   ============================================================ */
function aggregatePlayers(rows){
  const map = new Map();
  rows.forEach(r => {
    const key = r.name+'||'+r.lag;
    if (!map.has(key)) {
      map.set(key, { name:r.name, lag:r.lag, pos:new Set(), fodelsear:r.fodelsear, gp:0, g:0, a:0, tp:0, pim:0, serier:[] });
    }
    const p = map.get(key);
    p.pos.add(r.pos);
    p.gp += r.gp; p.g += r.g; p.a += r.a; p.tp += r.tp; p.pim += r.pim;
    p.serier.push({ serie:r.serie, gp:r.gp, g:r.g, a:r.a, tp:r.tp, pim:r.pim });
    if (!p.fodelsear && r.fodelsear) p.fodelsear = r.fodelsear;
  });
  return [...map.values()].map(p => ({
    ...p, pos:[...p.pos].join('/'), pg: p.gp > 0 ? +(p.tp/p.gp).toFixed(2) : null,
  }));
}

function byggLagGPUppslag(){
  // Lagets faktiska antal spelade matcher (fran tabelldatan), per serie+lag - INTE summan av
  // spelarnas individuella GP (som bara mäter ihopräknad speltid för hela truppen).
  const uppslag = {};
  seasonData().grupper.forEach(g => {
    (g.tabell || []).forEach(rad => { uppslag[g.serie+'||'+rad[1]] = rad[2]; });
  });
  return uppslag;
}

function aggregateTeams(rows){
  // Nyckeln ar serie+lag, INTE bara lagnamnet - tva olika lag i tva olika serier kan raka
  // heta samma sak (t.ex. "AIK" i bade en U15- och en U16-serie), och ska da rakas som
  // tva separata rader, inte slas ihop till en.
  const lagGPUppslag = byggLagGPUppslag();
  const map = new Map();
  rows.forEach(r => {
    const key = r.serie + '||' + r.lag;
    if (!map.has(key)) map.set(key, { lag:r.lag, serie:r.serie, kategori:r.kategori, spelareSet:new Set(), g:0, a:0, tp:0, pim:0 });
    const t = map.get(key);
    t.spelareSet.add(r.name);
    t.g += r.g; t.a += r.a; t.tp += r.tp; t.pim += r.pim;
  });
  return [...map.values()].map(t => {
    const gp = lagGPUppslag[t.serie+'||'+t.lag] || 0;
    return {
      lag:t.lag, serie:t.serie, kategori:t.kategori, antal:t.spelareSet.size, gp, g:t.g, a:t.a, tp:t.tp, pim:t.pim,
      pg: gp > 0 ? +(t.tp/gp).toFixed(2) : null,
    };
  });
}

// MIP (speltid i mal) kommer som "mm:ss" - racknas om till sekunder for att kunna
// summeras over flera serier, och tillbaka till "mm:ss" for visning.
function mipTillSekunder(mip){
  if (!mip) return 0;
  const delar = mip.split(':');
  const m = parseInt(delar[0], 10) || 0, s = parseInt(delar[1], 10) || 0;
  return m * 60 + s;
}
function sekunderTillMip(sek){
  const m = Math.floor(sek / 60), s = sek % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function aggregateGoalkeepers(rows){
  const map = new Map();
  rows.forEach(r => {
    const key = r.name+'||'+r.lag;
    if (!map.has(key)) {
      map.set(key, { name:r.name, lag:r.lag, fodelsear:r.fodelsear, gpi:0, mipSek:0, ga:0, svs:0, sog:0, so:0, w:0, l:0, serier:[] });
    }
    const m = map.get(key);
    const mipSek = mipTillSekunder(r.mip);
    m.gpi += r.gpi; m.mipSek += mipSek; m.ga += r.ga; m.svs += r.svs; m.sog += r.sog; m.so += r.so; m.w += r.w; m.l += r.l;
    m.serier.push({
      serie:r.serie, gpi:r.gpi, mip:r.mip, ga:r.ga, svs:r.svs, sog:r.sog, so:r.so, w:r.w, l:r.l,
      svspct: r.sog > 0 ? +(r.svs/r.sog*100).toFixed(2) : null,
      gaa: mipSek > 0 ? +(r.ga*3600/mipSek).toFixed(2) : null,
    });
    if (!m.fodelsear && r.fodelsear) m.fodelsear = r.fodelsear;
  });
  return [...map.values()].map(m => ({
    ...m,
    mip: sekunderTillMip(m.mipSek),
    svspct: m.sog > 0 ? +(m.svs/m.sog*100).toFixed(2) : null,
    gaa: m.mipSek > 0 ? +(m.ga*3600/m.mipSek).toFixed(2) : null,
  }));
}

function renderHead(cols){
  const head = document.getElementById('headRow');
  head.innerHTML = '';
  cols.forEach(c => {
    const th = document.createElement('th');
    if (c.num) th.classList.add('num-col');
    th.classList.add('col-' + c.key);
    if (c.hint) th.title = c.hint;
    th.innerHTML = c.label + (c.sortable === false ? '' : '<span class="arrow">▼</span>');
    if (c.sortable !== false) {
      if (c.key === sortKey) th.classList.add('sorted');
      th.addEventListener('click', () => {
        if (sortKey === c.key) sortDir *= -1; else { sortKey = c.key; sortDir = -1; }
        renderTable();
      });
    }
    head.appendChild(th);
  });
}

function sortRows(rows){
  return rows.slice().sort((a,b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (va == null) va = -Infinity; if (vb == null) vb = -Infinity;
    if (typeof va === 'string') return va.localeCompare(vb, 'sv') * sortDir;
    return (va - vb) * sortDir;
  });
}

const MALVAKT_MIN_GP = 5; // farre matcher an sa ar for fa for att SVS%/GAA ska saga nagot
function malvaktKravMinstaGP(){
  // SVS% och GAA blir missvisande pa ett par matcher (en ensam shutout kan skjuta en
  // malvakt till toppen) - da sorteras de malvakterna underst i listan istallet, sa
  // topplistan alltid leds av nagon med ett rimligt antal matcher i mal.
  return sortKey === 'svspct' || sortKey === 'gaa';
}
function sortMalvakter(rows){
  if (!malvaktKravMinstaGP()) return sortRows(rows);
  const kvalificerade = rows.filter(r => r.gpi >= MALVAKT_MIN_GP);
  const forFa = rows.filter(r => r.gpi < MALVAKT_MIN_GP);
  return [...sortRows(kvalificerade), ...sortRows(forFa)];
}

const SPELARE_MIN_GP = 5; // samma resonemang som for malvakter - P/G blir missvisande pa fa matcher
function spelareKravMinstaGP(){
  return sortKey === 'pg';
}
function sortSpelare(rows){
  if (!spelareKravMinstaGP()) return sortRows(rows);
  const kvalificerade = rows.filter(r => r.gp >= SPELARE_MIN_GP);
  const forFa = rows.filter(r => r.gp < SPELARE_MIN_GP);
  return [...sortRows(kvalificerade), ...sortRows(forFa)];
}

   ============================================================ */
function renderStandings(){
  // Tabellen styrs av Ålder/Serie-filtren (Lag/Födelseår ar spelaregenskaper och paverkar inte
  // serietabellen) - MEN bara nar man inte soker. Sok ska alltid kunna hitta ett lag i vilken
  // serie/ålderskategori som helst, aven om den ar bortfiltrerad i sidopanelen; byggKort()
  // dolier anda korten som inte matchar sokningen.
  const grupper = seasonData().grupper;
  const relevantGrupper = search ? grupper : grupper.filter(g => !excludedKategori.has(g.kategori) && !excludedSeries.has(g.serie));

  // Nålade favoritserier lyfts ut i en egen sektion HOGST UPP, ovanfor alla ålderskategorier
  // (inte bara forst inom sin egen ålderskategori) - det var det som efterfragades. Ovriga
  // serier grupperas per ålderskategori som forut, sorterade pa senast uppdaterad forst.
  const favoriter = relevantGrupper.filter(g => favoritSerier.has(g.id))
    .sort((a, b) => (b.uppdaterad || '').localeCompare(a.uppdaterad || ''));
  const ovrigaGrupper = relevantGrupper.filter(g => !favoritSerier.has(g.id));

  const perKategori = {};
  ovrigaGrupper.forEach(g => { (perKategori[g.kategori] = perKategori[g.kategori] || []).push(g); });
  const kategorier = Object.keys(perKategori);
  Object.values(perKategori).forEach(lista => {
    lista.sort((a, b) => (b.uppdaterad || '').localeCompare(a.uppdaterad || ''));
  });

  const el = document.getElementById('standingsSection');
  el.innerHTML = '';

  let synligaSerier = 0, synligaLag = 0;

  function byggKort(g, visaKatChip){
    const allaRader = g.tabell || [];
    const rader = allaRader.filter(r => matchesSearch(r[1]));
    if (search && rader.length === 0) return null; // dolj kortet om ingen match pa lagnamn

    const card = document.createElement('div');
    card.className = 'standings-card';
    const h4 = document.createElement('h4');
    if (visaKatChip) {
      // I favoritsektionen blandas flera ålderskategorier - da behovs kategorin pa kortet,
      // eftersom sektionsrubriken inte langre bar den informationen.
      const katChip = document.createElement('span');
      katChip.className = 'chip ' + kategoriChipClass(g.kategori);
      katChip.textContent = g.kategori;
      h4.appendChild(katChip);
    }
    const titel = document.createElement('span');
    titel.className = 'serie-title';
    titel.textContent = g.serie;
    const uppdateradEl = document.createElement('span');
    uppdateradEl.className = 'serie-updated';
    uppdateradEl.textContent = formatDatumKort(g.uppdaterad);
    uppdateradEl.title = g.uppdaterad ? `Senast uppdaterad ${g.uppdaterad}` : '';
    const pinBtn = document.createElement('button');
    pinBtn.type = 'button';
    pinBtn.className = 'pin-btn' + (favoritSerier.has(g.id) ? ' active' : '');
    pinBtn.innerHTML = favoritSerier.has(g.id) ? '★' : '☆';
    pinBtn.title = favoritSerier.has(g.id) ? 'Ta bort som favorit' : 'Nåla fast som favorit';
    pinBtn.addEventListener('click', e => { e.stopPropagation(); vaxlaFavorit(g.id); });
    h4.title = `Visa serievy för ${g.serie}`;
    h4.addEventListener('click', () => filtreraPaSerie(g));
    h4.appendChild(titel);
    h4.appendChild(uppdateradEl);
    h4.appendChild(pinBtn);
    card.appendChild(h4);

    if (allaRader.length === 0) {
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.style.padding = '12px';
      hint.textContent = 'Ingen tabell publicerad ännu.';
      card.appendChild(hint);
    } else {
      const table = document.createElement('table');
      table.innerHTML = '<thead><tr><th>#</th><th>Lag</th><th>GP</th><th>W</th><th>T</th><th>L</th><th>+/-</th><th>P</th></tr></thead>';
      const tbody = document.createElement('tbody');
      rader.forEach(r => {
        const [rk, lag, gp, w, t, l, gd, tp] = r;
        const gdCls = gd > 0 ? 'gd-pos' : gd < 0 ? 'gd-neg' : '';
        const gdTxt = gd > 0 ? `+${gd}` : `${gd}`;
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${rk ?? ''}</td><td><span class="lag-cell">${lagLogoHtml(lag)}<span class="lag-text" title="${lag}">${lag}</span></span></td><td>${gp}</td><td>${w}</td><td>${t}</td><td>${l}</td><td class="${gdCls}">${gdTxt}</td><td class="tp">${tp}</td>`;
        tr.addEventListener('click', () => filtreraPaLag(lag, g.serie));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      card.appendChild(table);
      synligaLag += rader.length;
    }
    synligaSerier++;
    return card;
  }

  function byggSektion(headerNoder, lista, visaKatChipPerKort){
    const grid = document.createElement('div');
    grid.className = 'standings-grid';
    lista.forEach(g => {
      const card = byggKort(g, visaKatChipPerKort);
      if (card) grid.appendChild(card);
    });
    if (grid.children.length === 0) return;
    const wrap = document.createElement('div');
    wrap.className = 'standings-kategori';
    const h3 = document.createElement('h3');
    headerNoder.forEach(n => h3.appendChild(n));
    wrap.appendChild(h3);
    wrap.appendChild(grid);
    el.appendChild(wrap);
  }

  if (favoriter.length > 0) {
    const star = document.createElement('span');
    star.className = 'chip chip-favorit';
    star.textContent = '★ Favoriter';
    byggSektion([star], favoriter, true);
  }

  kategorier.forEach(kat => {
    const chip = document.createElement('span');
    chip.className = 'chip ' + kategoriChipClass(kat);
    chip.textContent = kat;
    byggSektion([chip, document.createTextNode('Tabeller')], perKategori[kat], false);
  });

  if (el.children.length === 0) {
    el.innerHTML = `<div class="table-card"><div class="empty-state"><div class="big">Inga träffar</div>Justera filtren i sidopanelen eller sökningen.</div></div>`;
  }

  document.getElementById('summaryStats').innerHTML = `
    <div class="stat"><span class="n num">${synligaSerier}</span><span class="l">Serier</span></div>
    <div class="stat"><span class="n num">${synligaLag}</span><span class="l">Lag</span></div>
  `;
}

function byggMatchRad(rad, arSpelad){
  const row = document.createElement('div');
  row.className = 'match-row';
  const [datum, hemma, borta, a, b, arenaOmSpelad] = rad;
  const arena = arSpelad ? arenaOmSpelad : a; // olika kolumnordning for kommande/spelade rader
  const datumEl = document.createElement('span');
  datumEl.className = 'match-date';
  datumEl.textContent = formatMatchDatum(datum);

  const teams = document.createElement('span');
  teams.className = 'match-teams';
  const hemmaEl = document.createElement('span');
  hemmaEl.className = 'match-team';
  hemmaEl.innerHTML = `${lagLogoHtml(hemma)}<span class="match-team-name">${hemma}</span>`;
  const scoreEl = document.createElement('span');
  if (arSpelad) {
    scoreEl.className = 'match-score';
    scoreEl.textContent = `${a ?? '–'} - ${b ?? '–'}`;
  } else {
    scoreEl.className = 'match-score tbd';
    scoreEl.textContent = 'vs';
  }
  const bortaEl = document.createElement('span');
  bortaEl.className = 'match-team';
  bortaEl.innerHTML = `${lagLogoHtml(borta)}<span class="match-team-name">${borta}</span>`;
  teams.append(hemmaEl, scoreEl, bortaEl);

  const arenaEl = document.createElement('span');
  arenaEl.className = 'match-venue';
  arenaEl.textContent = arena || '';

  row.append(datumEl, teams, arenaEl);
  return row;
}

function byggMatchSektion(titel, matcher, arSpelad){
  const sek = document.createElement('div');
  sek.className = 'match-section';
  const h3 = document.createElement('h3');
  h3.textContent = titel;
  sek.appendChild(h3);
  const lista = document.createElement('div');
  lista.className = 'match-list';
  matcher.forEach(rad => lista.appendChild(byggMatchRad(rad, arSpelad)));
  sek.appendChild(lista);
  return sek;
}

function byggSerieTabellKort(g){
  const card = document.createElement('div');
  card.className = 'standings-card serie-vy-tabell';
  const allaRader = g.tabell || [];
  const rader = allaRader.filter(r => matchesSearch(r[1]));
  if (allaRader.length === 0) {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.style.padding = '12px';
    hint.textContent = 'Ingen tabell publicerad ännu.';
    card.appendChild(hint);
    return card;
  }
  const table = document.createElement('table');
  table.innerHTML = '<thead><tr><th>#</th><th>Lag</th><th>GP</th><th>W</th><th>T</th><th>L</th><th>+/-</th><th>P</th></tr></thead>';
  const tbody = document.createElement('tbody');
  rader.forEach(r => {
    const [rk, lag, gp, w, t, l, gd, tp] = r;
    const gdCls = gd > 0 ? 'gd-pos' : gd < 0 ? 'gd-neg' : '';
    const gdTxt = gd > 0 ? `+${gd}` : `${gd}`;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${rk ?? ''}</td><td><span class="lag-cell">${lagLogoHtml(lag)}<span class="lag-text" title="${lag}">${lag}</span></span></td><td>${gp}</td><td>${w}</td><td>${t}</td><td>${l}</td><td class="${gdCls}">${gdTxt}</td><td class="tp">${tp}</td>`;
    tr.addEventListener('click', () => filtreraPaLag(lag, g.serie));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  card.appendChild(table);
  return card;
}

function byggSeriePoanglista(){
  const wrap = document.createElement('div');
  wrap.className = 'serie-vy-poanglista';
  const h3 = document.createElement('h3');
  h3.textContent = 'Poängliga';
  wrap.appendChild(h3);

  // Vid det har laget ar Ålder/Serie redan begransat till exakt en serie (det ar ett krav
  // for att komma hit), sa getFilteredRows() ger automatiskt bara denna series spelare -
  // fortfarande med hansyn till aktiva Lag/Fodelsear-filter, precis som Spelare-vyn.
  // tvingaRespekteraFilter=true: har ar filtren sidans egen avgransning till EN serie/ETT
  // lag, inte nagot en pagaende sokning ska kunna kringga.
  const rowsRaw = getFilteredRows(true);
  const spelare = aggregatePlayers(rowsRaw)
    .filter(p => matchesSearch(p.name) || matchesSearch(p.lag))
    .sort((a,b) => (b.tp - a.tp) || (b.g - a.g));

  if (spelare.length === 0) {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.style.padding = '12px';
    hint.textContent = 'Ingen spelarstatistik publicerad ännu.';
    wrap.appendChild(hint);
    return { el: wrap, antal: 0, rowsRaw };
  }

  const card = document.createElement('div');
  card.className = 'table-card';
  const scroll = document.createElement('div');
  scroll.className = 'table-scroll';
  const table = document.createElement('table');
  table.innerHTML = `<thead><tr>
    <th class="num-col">#</th><th>Spelare</th><th>Lag</th><th>Pos</th>
    <th class="num-col">Född</th><th class="num-col">GP</th><th class="num-col">M</th><th class="num-col">A</th>
    <th class="num-col">TP</th><th class="num-col">P/G</th><th class="num-col">Utv</th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');
  spelare.forEach((p, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rk num">${i+1}</td>
      <td><div class="name-cell"><span class="full">${p.name}</span></div></td>
      <td class="col-lag"><span class="lag-cell">${lagLogoHtml(p.lag)}<span class="lag-text">${p.lag}</span></span></td>
      <td><span class="pos-badge">${p.pos || '–'}</span></td>
      <td class="num-col num">${p.fodelsear || '–'}</td>
      <td class="num-col num">${p.gp}</td>
      <td class="num-col num">${p.g}</td>
      <td class="num-col num">${p.a}</td>
      <td class="num-col num tp-cell">${p.tp}</td>
      <td class="num-col num">${p.pg ?? '–'}</td>
      <td class="num-col num">${p.pim}</td>
    `;
    tr.querySelector('.col-lag').addEventListener('click', e => { e.stopPropagation(); filtreraPaLag(p.lag, p.serier[0] && p.serier[0].serie); });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  card.appendChild(scroll);
  wrap.appendChild(card);
  return { el: wrap, antal: spelare.length, rowsRaw };
}

function renderSerieVy(){
  const el = document.getElementById('serieSection');
  el.innerHTML = '';
  const grupper = seasonData().grupper.filter(g => !excludedKategori.has(g.kategori) && !excludedSeries.has(g.serie));
  if (grupper.length !== 1) {
    el.innerHTML = `<div class="table-card"><div class="empty-state"><div class="big">Välj en enskild serie</div>Filtrera fram exakt en serie i filtren till vänster, eller klicka på en serie i Tabell-vyn, för att se serievyn.</div></div>`;
    updateSummary(0, 0);
    return;
  }
  const g = grupper[0];

  const header = document.createElement('div');
  header.className = 'serie-vy-header';
  const katChip = document.createElement('span');
  katChip.className = 'chip ' + kategoriChipClass(g.kategori);
  katChip.textContent = g.kategori;
  const h2 = document.createElement('h2');
  h2.textContent = g.serie;
  const uppdateradEl = document.createElement('span');
  uppdateradEl.className = 'serie-vy-updated';
  uppdateradEl.textContent = g.uppdaterad ? `Uppdaterad ${g.uppdaterad}` : '';
  const pinBtn = document.createElement('button');
  pinBtn.type = 'button';
  pinBtn.className = 'pin-btn' + (favoritSerier.has(g.id) ? ' active' : '');
  pinBtn.innerHTML = favoritSerier.has(g.id) ? '★' : '☆';
  pinBtn.title = favoritSerier.has(g.id) ? 'Ta bort som favorit' : 'Nåla fast som favorit';
  pinBtn.addEventListener('click', () => vaxlaFavorit(g.id));
  header.append(katChip, h2, uppdateradEl, pinBtn);
  el.appendChild(header);

  // g.matcher lagrar hela sasongens schema (for att Lag-vyns per-lag-filtrering alltid ska
  // ha nog med matcher att valja bland) - i serieoversikten racker det med en kort
  // fonsterlista, annars svammar sidan igen for serier med manga lag/omgangar.
  const kommande = ((g.matcher && g.matcher.kommande) || []).slice(0, 5);
  if (kommande.length > 0) el.appendChild(byggMatchSektion('Kommande matcher', kommande, false));

  el.appendChild(byggSerieTabellKort(g));

  const spelade = ((g.matcher && g.matcher.spelade) || []).slice(0, 5);
  if (spelade.length > 0) el.appendChild(byggMatchSektion('Senaste resultat', spelade, true));

  const { el: poangEl, antal, rowsRaw } = byggSeriePoanglista();
  el.appendChild(poangEl);

  updateSummary(antal, 0, rowsRaw);
}

function hittaGruppForLag(lagNamn, serieNamn){
  // Lagnamn ar bara unika INOM en serie (tva olika lag i tva olika serier kan raka heta
  // samma sak) - darfor letar vi upp EXAKT den serie fokusSerie pekar pa, inte alla serier
  // dar namnet forekommer.
  return seasonData().grupper.find(g => {
    if (g.serie !== serieNamn) return false;
    const lagISerien = new Set([...g.spelare.map(r => r[1]), ...(g.malvakter || []).map(r => r[1])]);
    return lagISerien.has(lagNamn);
  });
}

function renderLagVy(){
  const el = document.getElementById('lagSection');
  el.innerHTML = '';
  if (!fokusLag) {
    el.innerHTML = `<div class="table-card"><div class="empty-state"><div class="big">Inget lag valt</div>Klicka på ett lag i någon av vyerna för att se lagets sida.</div></div>`;
    updateSummary(0, 0);
    return;
  }
  const g = hittaGruppForLag(fokusLag, fokusSerie);
  if (!g) {
    el.innerHTML = `<div class="table-card"><div class="empty-state"><div class="big">Hittar inte laget</div>${fokusLag} finns inte i den valda säsongen.</div></div>`;
    updateSummary(0, 0);
    return;
  }

  const header = document.createElement('div');
  header.className = 'serie-vy-header lag-vy-header';
  const h2 = document.createElement('h2');
  h2.innerHTML = `<span class="lag-vy-namn">${lagLogoHtml(fokusLag)}<span>${fokusLag}</span></span>`;
  header.appendChild(h2);
  el.appendChild(header);

  const serieHeader = document.createElement('div');
  serieHeader.className = 'lag-vy-serie-header';
  const katChip = document.createElement('span');
  katChip.className = 'chip ' + kategoriChipClass(g.kategori);
  katChip.textContent = g.kategori;
  const namn = document.createElement('span');
  namn.className = 'lag-vy-serie-namn';
  namn.textContent = g.serie;
  const uppdateradEl = document.createElement('span');
  uppdateradEl.className = 'serie-vy-updated';
  uppdateradEl.textContent = g.uppdaterad ? `Uppdaterad ${g.uppdaterad}` : '';
  serieHeader.append(katChip, namn, uppdateradEl);
  el.appendChild(serieHeader);

  const block = document.createElement('div');
  block.className = 'lag-vy-block';

  // 1) Narmast kommande matcher, 2) serietabell, 3) senaste resultat - i den ordningen.
  const kommande = ((g.matcher && g.matcher.kommande) || [])
    .filter(m => m[1] === fokusLag || m[2] === fokusLag).slice(0, 3);
  if (kommande.length > 0) block.appendChild(byggMatchSektion('Kommande matcher', kommande, false));

  block.appendChild(byggSerieTabellKort(g));

  const spelade = ((g.matcher && g.matcher.spelade) || [])
    .filter(m => m[1] === fokusLag || m[2] === fokusLag).slice(0, 3);
  if (spelade.length > 0) block.appendChild(byggMatchSektion('Senaste resultat', spelade, true));

  el.appendChild(block);

  // 4) Intern poängliga for laget - Lag-filtret har redan begransats till exakt detta lag
  // i just denna serie (av filtreraPaLag), sa getFilteredRows() ger automatiskt bara dess spelare.
  const { el: poangEl, antal, rowsRaw } = byggSeriePoanglista();
  el.appendChild(poangEl);

  updateSummary(antal, 0, rowsRaw);
}

function updateSummary(nRows, nLag, rowsRaw){
  const el = document.getElementById('summaryStats');
  const visarIndivider = currentView === 'spelare' || currentView === 'malvakt' || currentView === 'serie' || currentView === 'lagdetalj';
  const nSpelare = visarIndivider ? nRows : new Set((rowsRaw||[]).map(r=>r.name+'||'+r.lag)).size;
  const nLagTotal = new Set((rowsRaw||[]).map(r=>r.lag)).size;
  const nSerier = new Set((rowsRaw||[]).map(r=>r.serie)).size;
  const etikett = currentView === 'malvakt' ? 'Målvakter' : 'Spelare';
  el.innerHTML = `
    <div class="stat"><span class="n num">${nSpelare}</span><span class="l">${etikett}</span></div>
    <div class="stat"><span class="n num">${nLagTotal}</span><span class="l">Lag</span></div>
    <div class="stat"><span class="n num">${nSerier}</span><span class="l">Serier valda</span></div>
  `;
}

/* ============================================================
   WIRE UP
   ============================================================ */
const searchInputEl = document.getElementById('searchInput');
const searchBoxEl = document.getElementById('searchBox');

// Varje vy har sina egna kolumner - vissa sorteringsnycklar (t.ex. "svspct") finns bara
// i Malvakt-vyn. Byter man vy atestalls darfor sorteringen till vyns naturliga standard,
// annars skulle listan se osorterad ut om den ardvande nyckeln inte finns pa raderna.
const VY_DEFAULT_SORT = { spelare:['tp',-1], lag:['tp',-1], malvakt:['svspct',-1], tabell:['tp',-1], serie:['tp',-1] };
function bytVy(nyVy){
  if (nyVy !== currentView) {
    const [nyckel, riktning] = VY_DEFAULT_SORT[nyVy] || ['tp', -1];
    sortKey = nyckel; sortDir = riktning;
  }
  currentView = nyVy;
  // .view-toggle finns bade i toppmenyn och i den fastnalade bottombaren pa mobil -
  // bada halls i synk har.
  document.querySelectorAll('.view-toggle button').forEach(b => b.classList.toggle('active', b.dataset.view === nyVy));
}

// "Serie"-fliken ar bara meningsfull nar exakt en serie ar vald (via filtren eller genom
// att man klickat sig fram fran Tabell-vyn) - annars ar den inaktiv. Finns i bade topp-
// och bottombaren.
function syncSerieKnapp(){
  const grupper = seasonData().grupper.filter(g => !excludedKategori.has(g.kategori) && !excludedSeries.has(g.serie));
  document.querySelectorAll('.serie-view-btn').forEach(b => { b.disabled = grupper.length !== 1; });
}

function autoVaxlaVyForSokning(){
  // Om sokningen bara ger traff bland spelare/malvakter (t.ex. ett namn) medan man star pa
  // Tabell eller Lag - som saknar namn - vaxla automatiskt till ratt vy.
  // Star man redan pa en vy dar sokningen faktiskt ger traff (t.ex. ett lagnamn i
  // Tabell/Lag), lat anvandaren stanna kvar dar. Serie-vyn har redan bade lagnamn och
  // spelarnamn, sa den behover heller aldrig vaxlas bort ifran.
  if (!search || currentView === 'spelare' || currentView === 'malvakt' || currentView === 'serie' || currentView === 'lagdetalj') return;

  const rowsRaw = getFilteredRows();
  const gkRowsRaw = getFilteredGkRows();
  const spelareTraff = rowsRaw.some(r => matchesSearch(r.name) || matchesSearch(r.lag));
  const malvaktTraff = gkRowsRaw.some(r => matchesSearch(r.name) || matchesSearch(r.lag));
  if (!spelareTraff && !malvaktTraff) return;

  let traffINuvarandeVy;
  if (currentView === 'tabell') {
    // search ar redan garanterat ifylld har (se tidiga returen ovan) - sok genom ALLA
    // grupper, inte bara de just nu ikryssade i Alder/Serie-filtren.
    traffINuvarandeVy = seasonData().grupper.some(g => (g.tabell || []).some(r => matchesSearch(r[1])));
  } else {
    traffINuvarandeVy = rowsRaw.some(r => matchesSearch(r.lag)) || gkRowsRaw.some(r => matchesSearch(r.lag));
  }
  if (traffINuvarandeVy) return;

  // Foredra Spelare-vyn om bade spelare och malvakter ger traff (vanligast fallet).
  bytVy(spelareTraff ? 'spelare' : 'malvakt');
}

searchInputEl.addEventListener('input', e => {
  search = e.target.value.trim();
  searchBoxEl.classList.toggle('has-value', e.target.value.length > 0);
  expandedRow = null;
  autoVaxlaVyForSokning();
  renderTable();
});
document.getElementById('clearSearchBtn').addEventListener('click', () => {
  searchInputEl.value = '';
  search = '';
  searchBoxEl.classList.remove('has-value');
  expandedRow = null;
  renderTable();
  searchInputEl.focus();
});
document.getElementById('mobileFilterToggle').addEventListener('click', () => {
  document.getElementById('filterPanel').classList.toggle('expanded');
});
// Öppna/stäng dropdown-filtren (Ålder/Serie/Lag), stäng vid klick utanför eller Escape
document.addEventListener('click', e => {
  const toggle = e.target.closest('.dropdown-toggle');
  if (toggle) {
    const dd = toggle.closest('.dropdown');
    const wasOpen = dd.classList.contains('open');
    document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
    if (!wasOpen) dd.classList.add('open');
    return;
  }
  // Anvander composedPath (ett ogonblicksfoto av tradet vid klicktillfallet) istallet for
  // e.target.closest - annars uppfattas t.ex. "Avmarkera alla" som ett klick utanfor och
  // stanger dropdownen, eftersom renderAll() hinner byta ut panelens innehall (och dermed
  // koppla loss e.target fran dokumentet) innan klicket bubblar hit.
  const path = e.composedPath ? e.composedPath() : [];
  const insidePanel = path.some(node => node.classList && node.classList.contains('dropdown-panel'));
  if (!insidePanel) {
    document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
});
document.getElementById('brandHome').addEventListener('click', gaTillStartsidan);
document.getElementById('brandHome').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); gaTillStartsidan(); }
});
document.getElementById('selectAllBtn').addEventListener('click', () => { resetFilters(); renderAll(); });
document.getElementById('selectNoneBtn').addEventListener('click', () => {
  const grupper = seasonData().grupper;
  excludedKategori = new Set(grupper.map(g => g.kategori));
  renderAll();
});
// Delegerad pa document istallet for att bindas till en specifik behallare, sa samma
// hantering gäller bade toppmenyns och bottombarens vy-vaxlare.
document.addEventListener('click', e => {
  const btn = e.target.closest('.view-toggle button');
  if (!btn) return;
  expandedRow = null;
  bytVy(btn.dataset.view);
  renderTable();
});

// Matter toppbannerns hojd och sparar den som en CSS-variabel, sa den fastnalade
// filterpanelen/flikvaljaren vet exakt var de ska sluta under den fastnalade
// toppbannern (bannern kan bli hogre/lagre beroende pa skarmbredd - sokruta och
// sasongsvaljare radbryts olika, och antal sasongsflikar kan andras over tid).
function syncTopbarHeight(){
  const h = document.querySelector('.topbar').getBoundingClientRect().height;
  document.documentElement.style.setProperty('--topbar-h', h + 'px');
}
window.addEventListener('resize', syncTopbarHeight);

function renderAll(){
  renderSeasonTabs();
  renderFilters();
  syncSerieKnapp();
  renderTable();
  document.getElementById('updatedNote').textContent = `Senast uppdaterad: ${seasonData().uppdaterad}`;
  document.getElementById('bottomBarFooter').textContent = `Uppdaterad ${formatDatumKort(seasonData().uppdaterad)} · Källa: Swehockey`;
  syncTopbarHeight();
}

/* ============================================================
   HISTORIK - webblasarens bakatknapp gar tillbaka ett steg pa sidan
   (vy, sasong, lag eller serie) i stallet for att lamna den. Mindre
   andringar (filter, sortering, sokning) sparas i det aktuella steget
   sa att man inte behover klicka bakat for varje kryss.
   ============================================================ */
var aterstaller = false;
function tillstand(){
  return { hockeyhype:1, season:currentSeason, view:currentView, fokusLag, fokusSerie,
    excluded:[...excluded], excludedSeries:[...excludedSeries], excludedKategori:[...excludedKategori],
    excludedFodelsear:[...excludedFodelsear], excludedPosition:[...excludedPosition],
    search, sortKey, sortDir };
}
function navNyckel(s){
  // Serie-vyn visar den serie som filtren pekar ut - byte av serie ar ocksa ett nytt steg
  return JSON.stringify([s.season, s.view, s.fokusLag, s.fokusSerie,
    s.view === 'serie' ? [s.excludedSeries, s.excludedKategori] : null]);
}
function syncHistorik(){
  if (aterstaller) return;
  const s = tillstand();
  try {
    if (history.state && history.state.hockeyhype && navNyckel(history.state) !== navNyckel(s)) history.pushState(s, '');
    else history.replaceState(s, '');
  } catch (e) { /* historiken ar inte tillganglig (t.ex. i en inbaddad forhandsvisning) */ }
}
window.addEventListener('popstate', e => {
  const s = e.state;
  if (!s || !s.hockeyhype) return;
  aterstaller = true;
  currentSeason = s.season; currentView = s.view;
  fokusLag = s.fokusLag; fokusSerie = s.fokusSerie;
  excluded = new Set(s.excluded); excludedSeries = new Set(s.excludedSeries);
  excludedKategori = new Set(s.excludedKategori); excludedFodelsear = new Set(s.excludedFodelsear);
  excludedPosition = new Set(s.excludedPosition);
  search = s.search || ''; sortKey = s.sortKey; sortDir = s.sortDir; expandedRow = null;
  searchInputEl.value = search;
  searchBoxEl.classList.toggle('has-value', search.length > 0);
  document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.view-toggle button').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
  renderAll();
  aterstaller = false;
});

renderAll();
</script>
